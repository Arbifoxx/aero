[package]
name = "aero-macos"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "aero-macos"
path = "src/main.rs"

[dependencies]
aero-machine = { path = "../aero-machine", features = ["aerogpu-wgpu-backend"] }
aero-storage = { path = "../aero-storage" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
pollster = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "0.20"
winit = "0.29"
